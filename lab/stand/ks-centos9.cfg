# Kickstart: CentOS Stream 9 — минимальная установка лабораторной машины
# Подача: дописать в строку загрузчика inst.ks=http://<узел>:8000/ks-centos9.cfg
# ВНИМАНИЕ: пароли-заглушки CHANGE_ME — замените на свои одноразовые.
text
lang en_US.UTF-8
keyboard us
timezone Europe/Moscow

rootpw --plaintext CHANGE_ME
user --name=labuser --password=CHANGE_ME --plaintext --groups=wheel

network --bootproto=dhcp --activate
bootloader --location=mbr
clearpart --all --initlabel
autopart --type=plain
firstboot --disable
selinux --enforcing
services --enabled=sshd
reboot

%packages --ignoremissing
@core
openssh-server
perl
%end

%post --log=/root/ks-post.log
systemctl enable sshd
# Добавьте СВОЙ открытый SSH-ключ:
mkdir -p /home/labuser/.ssh
echo 'ssh-ed25519 AAAA... ваш-ключ' >> /home/labuser/.ssh/authorized_keys
chmod 700 /home/labuser/.ssh
chmod 600 /home/labuser/.ssh/authorized_keys
chown -R labuser:labuser /home/labuser/.ssh
# sudo без пароля — только для одноразовой лабораторной машины:
echo 'labuser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/99-lab
chmod 440 /etc/sudoers.d/99-lab
%end
